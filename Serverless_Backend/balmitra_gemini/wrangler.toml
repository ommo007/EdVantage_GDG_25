name = "balmitra-ai-assistant"
main = "src/index.js"
compatibility_date = "2024-12-11"
compatibility_flags = ["nodejs_compat"]

# Environment variables (set these in Cloudflare dashboard or using wrangler secret)
[env.production.vars]
# Add your environment variables here if they're not sensitive
# For sensitive vars like API keys, use: wrangler secret put GEMINI_API_KEY
# and: wrangler secret put TAVILY_API_KEY

[env.production]
name = "balmitra-ai-assistant"

# For development environment
[env.development.vars]
# Development environment variables

[env.development]
name = "balmitra-ai-assistant-dev"

# Worker limits and configuration
[limits]
memory = 128
duration = 30000 